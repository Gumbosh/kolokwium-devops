worker_processes auto;
events { worker_connections 1024; }

http {
    # Reverse proxy upstream.
    # Hostname MUST match the Compose service name.
    upstream app_backend {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Proxy everything to the backend and preserve original client info.
        location / {
            proxy_http_version 1.1;

            proxy_pass http://app_backend;

            # Preserve original request host and scheme
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve original client IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Avoid connection header issues with upstream keepalive
            proxy_set_header Connection "";

            # Sensible defaults
            proxy_redirect off;
        }
    }
}
